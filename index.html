<meta name="theme-color" content="#11181b">

<title>متابعة الحفظ</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#11181b;--card:#1a2328;--card2:#212d33;--line:#2c3b42;--tx:#e7edea;--mut:#8fa3a6;--ac:#6fbf9f;--gold:#e0c585;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;line-height:1.6;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.date{color:var(--mut);font-size:14px}
h1{margin:2px 0 12px;font-size:22px}
.hero{background:linear-gradient(135deg,#1d2c30,#1a2328);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}
.big{font-size:44px;font-weight:700;color:var(--gold);line-height:1;min-width:64px;text-align:center}
.hero small{color:var(--mut);display:block;font-size:13px}
.hero b{font-size:17px}
.bar{height:10px;background:var(--card2);border-radius:9px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.pc{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.g{margin:20px 4px 8px;color:var(--gold);font-weight:700;font-size:15px}
.t{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;color:var(--tx);font:inherit;cursor:pointer;min-height:64px}
.t .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #4a5d64;display:grid;place-items:center;margin-top:2px;font-size:16px;color:transparent}
.t b{display:block;font-weight:500;font-size:16px}
.t span{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.t.on{background:#17262a;border-color:#2f5a4b}
.t.on .ck{background:var(--ac);border-color:var(--ac);color:#0d1a15}
.t.on b{color:var(--mut);text-decoration:line-through}
.ok{background:#1b3028;border:1px solid #2f5a4b;color:#bfe8d4;border-radius:14px;padding:12px 14px;margin-top:14px;text-align:center}
.stats{display:flex;gap:8px;margin-top:20px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px;color:var(--ac)}
.stats span{font-size:12px;color:var(--mut)}
.stage{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}
.rs{display:block;margin:26px auto 0;background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px}
.nav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.nav button{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:20px}
.nav button:disabled{opacity:.3}
.dl{flex:1;position:relative;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;height:44px;display:grid;place-items:center;font-weight:500}
.dl input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.bk{display:block;margin:0 auto 12px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:6px 14px;font:inherit;font-size:14px}
details{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:500}
.f{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:14px}
.f input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
.ap{display:block;width:100%;margin-top:12px;background:var(--ac);color:#0d1a15;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700}
.nt{color:var(--mut);font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const JUZ=[1,22,42,62,82,102,122,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const juzOf=p=>{let j=1;JUZ.forEach((s,i)=>{if(p>=s)j=i+1});return j};
const n=x=>Number(x).toLocaleString('ar-EG',{maximumFractionDigits:1});
const K3='hifz-v3',mem={};
const st={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):mem[k]||null}catch(e){return mem[k]||null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+1)%7));return ymd(x)};
const init=()=>({P:3,weekId:'2026-10-31',weekBase:0,rp:1,day:null});
function load(){
  const v=st.get(K3);if(v)return v;
  const o=st.get('hifz-v2');
  if(o){let P=o.base0+1;const t=ymd(new Date());for(const k in o.days){const c=o.days[k].c||{};if(k<t&&c.l&&c.e&&c.k)P++}return{P,weekId:o.w0id,weekBase:o.wb0,rp:o.rp0,day:null}}
  const a=st.get('hifz-v1');
  if(a)return{P:a.day?a.day.base+1:a.M+1,weekId:a.weekId,weekBase:a.weekBase,rp:a.day?a.day.rpBefore:a.rp,day:a.day||null};
  return init();
}
let S=load(),armR=false,armA=false;
const save=()=>st.set(K3,S);
const revAmt=m=>m<=201?40:m<=301?50:m<=401?60:m<=501?70:80;
function seg(rp,pool,k){if(rp>pool)rp=1;let a=rp,e=Math.min(rp+k-1,pool);if(e>=pool-k/2)e=pool;if(e-a+1<k)a=Math.max(1,e-k+1);return[a,e]}
const r=(a,z)=>a===z?'صفحة '+n(a):'صفحات '+n(a)+' – '+n(z);
function tasks(d){
  const b=d.base,P=b+1,wb=S.weekBase,t=[];
  if(!d.fri&&P<=604){
    t.push({id:'l',g:'new',t:'استماع الصفحة ٣ مرات',d:'استماع فقط لإتقان التلاوة · '+r(P,P)});
    t.push({id:'e',g:'new',t:'إتقان الصفحة: ٥ مرات متتالية',d:'أي خطأ = إعادة الخمس مرات من البداية'});
    t.push({id:'k',g:'new',t:'تكرار الصفحة ٥٠ مرة غيبًا',d:'بصوت مسموع وبتأنٍّ · في جلسة أو جلستين'});
  }
  if(d.fri&&wb<b)t.push({id:'w',g:'rec',t:'تسميع حفظ الأسبوع ٧ مرات',d:r(wb+1,b)});
  if(!d.fri&&b>=1)t.push({id:'y',g:'rec',t:'تكرار حفظ الأمس ٥ مرات',d:r(b,b)});
  if(b>=1)t.push({id:'r',g:'rec',t:'الربط',d:b<81?'تسميع كل المحفوظ · '+r(1,b):'آخر ٢٠ صفحة · '+r(b-19,b)});
  if(d.rev){const[a,z]=d.rev;t.push({id:'v',g:'rec',t:'المراجعة',d:r(a,z)+' · الجزء '+n(juzOf(a))+(juzOf(z)!==juzOf(a)?' إلى '+n(juzOf(z)):'')})}
  const p1=wb+7;
  if(p1<=604)t.push({id:'p',g:'prep',t:'التحضير الأسبوعي: قراءة مرة واحدة',d:r(p1,Math.min(604,wb+12))+' · من المصحف'});
  return t;
}
const allDone=d=>{const T=tasks(d);return T.length>0&&T.every(x=>d.c[x.id])};
function ensureDay(){
  const now=new Date(),t=ymd(now);
  if(S.day&&S.day.date===t)return;
  let late=false;
  if(S.day&&!S.day.fri){if(allDone(S.day)){if(S.P<604)S.P++}else late=true}
  const ws=weekStart(now);
  if(S.weekId!==ws){S.weekId=ws;S.weekBase=S.P-1}
  const b=S.P-1,d={date:t,base:b,fri:now.getDay()===5,c:{},rpBefore:S.rp,late};
  if(b>=81){d.pool=b-20;d.rev=seg(S.rp,d.pool,revAmt(b))}
  S.day=d;save();
}
const GN={new:'الحفظ الجديد',rec:'التسميع والمراجعة',prep:'التحضير للأسبوع القادم'};
function render(){
  const op=document.querySelector('details'),wasOpen=op&&op.open;
  ensureDay();
  const d=S.day,c=d.c,T=tasks(d),P=d.base+1;
  const done=T.filter(x=>c[x.id]).length,pct=T.length?Math.round(done/T.length*100):0;
  const M=d.base+((!d.fri&&c.l&&c.e&&c.k)?1:0);
  const lbl=new Date().toLocaleDateString('ar-EG-u-ca-gregory',{weekday:'long',day:'numeric',month:'long'});
  let hero;
  if(d.fri)hero='<div class="big">🕌</div><div><b>يوم الجمعة</b><small>لا حفظ جديد — تسميع الأسبوع والربط والمراجعة</small></div>';
  else if(P>604)hero='<div class="big">🌙</div><div><b>ختمت الحفظ، ما شاء الله</b></div>';
  else hero='<div class="big">'+n(P)+'</div><div><small>صفحة اليوم · الجزء '+n(juzOf(P))+'</small><b>'+(d.late?'تأجلت من يوم سابق ↻':'ثابتة حتى تكمل كل مهامها')+'</b></div>';
  let h='<div class="date">'+lbl+'</div><h1>متابعة الحفظ</h1><div class="hero">'+hero+'</div>';
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="pc"><span>'+n(done)+' من '+n(T.length)+'</span><span>'+n(pct)+'٪</span></div>';
  let lg='';
  T.forEach(x=>{
    if(x.g!==lg){h+='<div class="g">'+GN[x.g]+'</div>';lg=x.g}
    h+='<button class="t'+(c[x.id]?' on':'')+'" data-id="'+x.id+'"><div class="ck">✓</div><div><b>'+x.t+'</b><span>'+x.d+'</span></div></button>';
  });
  if(T.length&&done===T.length)h+='<div class="ok">'+(d.fri?'أتممت مهام الجمعة، تقبّل الله منك 🤍':'أتممت كل مهام صفحة '+n(P)+'. ستنتقل غدًا إلى الصفحة '+n(Math.min(P+1,604))+' بإذن الله 🤍')+'</div>';
  else if(T.length&&!d.fri)h+='<div class="stage">لن تنتقل إلى الصفحة '+n(Math.min(P+1,604))+' قبل إكمال كل المهام وتغيّر التاريخ</div>';
  h+='<div class="stats"><div><b>'+n(M)+'</b><span>صفحة محفوظة</span></div><div><b>'+n(M/20)+'</b><span>جزء تقريبًا</span></div><div><b>'+n(604-M)+'</b><span>صفحة متبقية</span></div></div>';
  h+='<div class="stage">'+(M<81?'المرحلة: ربط شامل لكل المحفوظ':'المرحلة: ربط آخر ٢٠ صفحة + مراجعة')+'</div>';
  h+='<details'+(wasOpen?' open':'')+'><summary>الذهاب إلى صفحة أخرى</summary><div class="f"><span>صفحة الحفظ</span><input type="number" id="pg" min="1" max="604" value="'+Math.min(P,604)+'"></div><button class="ap" id="ap">'+(armA?'اضغط مرة أخرى للتأكيد':'تطبيق')+'</button><div class="nt">تصبح الصفحة المدخلة هي صفحة اليوم، وتبدأ مهام اليوم من جديد.</div></details>';
  h+='<button class="rs" id="rs">'+(armR?'اضغط مرة أخرى للتأكيد':'إعادة ضبط البيانات')+'</button>';
  $('app').innerHTML=h;
}
$('app').addEventListener('click',e=>{
  const t=e.target.closest('.t'),id=e.target.id,d=S.day;
  if(t){
    armR=armA=false;const k=t.dataset.id;d.c[k]=!d.c[k];
    if(k==='v')S.rp=d.c.v?(d.rev[1]>=d.pool?1:d.rev[1]+1):d.rpBefore;
    save();render();return;
  }
  if(id==='ap'){
    const p=+$('pg').value;
    if(!(p>=1&&p<=604))return;
    if(!armA){armA=true;render();return}
    const now=new Date();
    S.P=p;S.rp=1;S.weekId=weekStart(now);S.weekBase=Math.max(0,p-1-Math.min((now.getDay()+1)%7,5));S.day=null;
    save();armA=false;render();
  }else if(id==='rs'){
    if(armR){S=init();save();armR=false}else{armR=true;setTimeout(()=>{armR=false;render()},4000)}
    render();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
</script>
